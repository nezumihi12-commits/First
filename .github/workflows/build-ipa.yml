name: Build Ultra Dim Camera IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main", "feature/ultradim-camera" ]

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iPhone app
        run: |
          xcodebuild \
            -project MyFirstiOSApp.xcodeproj \
            -scheme MyFirstiOSApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package SideStore-compatible IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MyFirstiOSApp.app Payload/
          zip -qry UltraDimCamera.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: UltraDimCamera-IPA
          path: UltraDimCamera.ipa
          if-no-files-found: error
