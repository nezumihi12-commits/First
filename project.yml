name: UltraDimCamera
options:
  bundleIdPrefix: com.nezumihi12commits
targets:
  UltraDimCamera:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nezumihi12commits.ultradimcamera
        PRODUCT_NAME: UltraDimCamera
        INFOPLIST_KEY_CFBundleName: UltraDimCamera
        INFOPLIST_KEY_CFBundleDisplayName: UltraDimCamera
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "カメラの映像を表示し、動画を撮影するために使用します。"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "動画と一緒に音声を録音するために使用します。"
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "撮影した動画を写真アプリに保存するために使用します。"
        MARKETING_VERSION: 1.2
        CURRENT_PROJECT_VERSION: 3
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
