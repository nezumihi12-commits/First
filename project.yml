name: MyFirstiOSApp
options:
  bundleIdPrefix: com.example
targets:
  MyFirstiOSApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.myfirstiosapp
        PRODUCT_NAME: MyFirstiOSApp
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
